name: release

# 打 v* 标签即自动构建 Windows 产物并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...
          GOOS=windows go vet ./...

      - name: Build
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/boot-tool.exe ./cmd/boot-tool
          (cd dist && sha256sum boot-tool.exe > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/boot-tool.exe dist/SHA256SUMS.txt \
            --title "boot-tool ${GITHUB_REF_NAME}" \
            --generate-notes

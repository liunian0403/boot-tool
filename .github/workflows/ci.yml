name: ci

# PR / main 推送门禁：vet + 双平台检查 + 交叉编译 + 安装包编译，
# 避免坏提交拖到打 tag 发布时才暴露（docs/design.md §6.1、§13）。
on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:

jobs:
  test:
    name: vet + test + cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test (linux)
        run: |
          go vet ./...
          go test ./...

      - name: Vet and cross-compile (windows)
        run: |
          GOOS=windows go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -H=windowsgui" -o /tmp/boot-tool.exe ./cmd/boot-tool
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" -o /tmp/boot-tool-debug.exe ./cmd/boot-tool

  installer:
    # 验证 docs/design.md §13 的假设「Inno Setup 7.1.1 可在 windows-latest
    # 静默安装并 ISCC 出包」，不等到打 tag 才发现 .iss 或安装链路坏了。
    name: installer (Inno Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build exe
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/boot-tool.exe ./cmd/boot-tool

      # 与 release.yml 保持一致：同版本、同 sha256。
      - name: Install Inno Setup 7.1.1 (pinned)
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe"
          $sha = "8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0"
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-7.1.1-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $setup
          $got = (Get-FileHash -Algorithm SHA256 -Path $setup).Hash.ToLower()
          if ($got -ne $sha) { throw "Inno Setup installer sha256 mismatch: $got" }
          $dir = "C:\innosetup"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES","/DIR=$dir" -Wait | Out-Null
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "ISCC.exe not found in $dir" }

      - name: Compile setup.exe
        shell: pwsh
        run: |
          # 0.0.0 只是让脚本可编译的占位版本；发布版本由 release.yml 从 tag 传入
          & "C:\innosetup\ISCC.exe" "/DMyAppVersion=0.0.0" "packaging\boot-tool.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist\setup.exe")) { throw "dist\setup.exe was not produced" }
          Get-Item "dist\setup.exe" | Format-List Name, Length
